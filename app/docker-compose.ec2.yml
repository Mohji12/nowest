services:
  nowest-api:
    build:
      context: .
      dockerfile: Dockerfile.ec2
    container_name: nowest-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: nowest-nginx
    restart: unless-stopped
    depends_on:
      nowest-api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./ec2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
